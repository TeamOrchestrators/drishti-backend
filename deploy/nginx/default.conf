server {
    listen 80;
    listen [::]:80;
    server_name _;

    # The API only accepts JSON and small QR-related payloads today. This
    # avoids accidentally accepting unbounded upload bodies.
    client_max_body_size 10m;

    location = /healthz {
        proxy_pass http://backend:8080/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        # No trailing URI here: Nginx forwards /api/... unchanged.
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The frontend lives on Vercel, so this server intentionally serves no
    # static site and exposes no accidental directory listing.
    location / {
        return 404;
    }
}
