version: "2"

sql:
  - engine: "postgresql"
    schema: "../sql/schemas"
    queries: "../sql/queries"

    gen:
      go:
        package: "db"
        out: "db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
