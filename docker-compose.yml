services:
  analytics:
    # This directory is a separate Git repository cloned during deployment.
    # Compose builds it into the same private network as the Go API.
    build:
      context: ./analytics
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - drishti_internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      PORT: "8080"
    depends_on:
      analytics:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - drishti_internal

  # This service is intentionally behind the "tools" profile. It never starts
  # with the API; invoke it explicitly to apply schema migrations.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    env_file:
      - .env.production
    profiles:
      - tools
    restart: "no"
    networks:
      - drishti_internal

  nginx:
    image: nginx:stable-alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - drishti_internal

networks:
  drishti_internal:
    driver: bridge
